name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.pdfium }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pdfium: windows-x64
          - os: ubuntu-22.04
            pdfium: linux-x64
          - os: macos-latest
            pdfium: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Fetch PDFium
        shell: bash
        run: bash scripts/fetch-pdfium.sh ${{ matrix.pdfium }}

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: nfsetable ${{ github.ref_name }}
          releaseBody: Installers for Windows, Linux and macOS. See the README for details.
          releaseDraft: true
          prerelease: false
