[package]
name = "nfsetable-core"
description = "Reads Brazilian NFS-e PDFs and extracts field values (offline, no UI)."
license = "MIT"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "nfsetable_core"
path = "src/lib.rs"

[dependencies]
# PDFium bindings, loaded dynamically at runtime (no static linking).
# `pdfium_latest` selects the newest PDFium API known to this crate version (7881); the pinned
# binary (chromium/8066) is newer and API compatible. `thread_safe` serializes every PDFium call
# behind a global mutex, which makes `Pdfium` (and therefore `Engine`) Send + Sync.
# `image_latest` enables `PdfBitmap::as_image()` (image 0.25).
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "image_latest", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
csv = "1"
regex = "1"
rust_decimal = "1"
rust_decimal_macros = "1"
rust_xlsxwriter = "0.99"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
